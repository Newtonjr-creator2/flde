
name: real_buzzing_identifier
description: Mobile-first Flutter/Dart IDE for Android — Phase 1 (explorer + editor)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Real local filesystem access (dart:io wrapper is used directly for most ops;
  # this gives us Android scoped-storage-friendly directories).
  path_provider: ^2.1.4
  path: ^1.9.0

  # Storage Access Framework — lets the user pick a real folder on internal
  # storage / SD card / USB OTG to open as a project (spec section 23).
  # Bumped from 8.x because that AAR was compiled against compileSdk 34,
  # which fails flutter_plugin_android_lifecycle's SDK 36 requirement on
  # current Flutter/AGP. 12.0.0 was confirmed available in the build log.
  file_picker: ^12.0.0

  # Real ZIP extraction for "Import Project from ZIP" (spec section 5/78).
  archive: ^3.6.1

  # Real syntax highlighting engine (not a hand-rolled fake tokenizer).
  # Supports dart, yaml, json, xml, markdown, gradle(groovy), bash out of the box.
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
