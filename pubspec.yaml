
name: real_buzzing_identifier
description: FLDE — Mobile-first Flutter/Dart IDE for Android — Android workbench + system-linker runtime + toolchain bootstrap
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Real local filesystem access (dart:io wrapper is used directly for most ops;
  # this gives us Android scoped-storage-friendly directories).
  path_provider: ^2.1.4
  path: ^1.9.0

  # Storage Access Framework — lets the user pick a real folder on internal
  # storage / SD card / USB OTG to open as a project (spec section 23).
  # Bumped from 8.x because that AAR was compiled against compileSdk 34,
  # which fails flutter_plugin_android_lifecycle's SDK 36 requirement on
  # current Flutter/AGP. 12.0.0 was confirmed available in the build log.
  file_picker: ^12.0.0

  # Real ZIP extraction for "Import Project from ZIP" (spec section 5/78)
  # and toolchain archive extraction (Phase 2 Toolchain Manager).
  archive: ^3.6.1

  # sha256 checksum verification for downloaded toolchain archives — a
  # download is never installed/executed before its checksum is verified
  # against the manifest (Phase 2 spec section 3/6).
  crypto: ^3.0.5

  # Monaco is the same editor engine used by VS Code, hosted in Android WebView.
  # Replaces the old flutter_highlight-based plain-text editor — this is a
  # real syntax-aware editor, not a hand-rolled tokenizer.
  flutter_monaco: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # CI/build tooling places the Android ARM64 runtime probe here before
  # flutter build. Keeping it as a normal Flutter asset lets FLDE extract
  # the ELF into its managed filesystem at runtime.
  assets:
    - assets/runtime/runtime_probe_arm64-v8a
    - assets/toolchains/manifest.json
