name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: flutter create platform folders (first run only)
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.vyomquantum --project-name real_buzzing_identifier .
          fi

      - name: Accept Android SDK licenses (defensive — some deps pull newer platforms)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build FLDE Android ARM64 runtime probe
        run: |
          chmod +x tooling/build_runtime_probe.sh
          ./tooling/build_runtime_probe.sh

      - run: flutter pub get

      - name: Analyze (real errors are NOT hidden — a failure here must fail the build)
        run: flutter analyze

      - name: Test (real errors are NOT hidden — a failure here must fail the build)
        run: flutter test

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
