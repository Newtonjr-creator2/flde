name: Build RealBuzzingIdentifier APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android platform
        run: |
          if [ ! -d "android" ]; then
            flutter create \
              --org com.vyomquantum \
              --project-name real_buzzing_identifier \
              .
          fi

      - name: Configure Android compile SDK 36
        run: |
          python3 <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          found = False

          for file in candidates:
              if not file.exists():
                  continue

              found = True
              text = file.read_text()

              # Groovy Flutter template
              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )

              text = text.replace(
                  "compileSdk flutter.compileSdkVersion",
                  "compileSdk 36"
              )

              # Kotlin DSL Flutter template
              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )

              file.write_text(text)

              print(f"Updated {file}")

          if not found:
              raise SystemExit("ERROR: Could not find Android app Gradle file.")

          PY

      - name: Verify compile SDK
        run: |
          echo "Android Gradle configuration:"
          grep -R "compileSdk" android || true

          echo ""
          echo "Installed Android platforms:"
          sdkmanager --list_installed | grep "platforms;android" || true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze
        continue-on-error: true

      - name: Build debug APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --debug

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: realbuzzingidentifier-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
