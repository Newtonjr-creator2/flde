name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: flutter create platform folders (first run only)
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.vyomquantum --project-name real_buzzing_identifier .
          fi

      - name: Patch compileSdk to 36 (file_picker requires >= 36)
        run: |
          FILE=android/app/build.gradle.kts
          if [ ! -f "$FILE" ]; then FILE=android/app/build.gradle; fi
          echo "Target file: $FILE"
          echo "--- before ---"
          grep -in "compileSdk" "$FILE" || echo "(no compileSdk line found — template may use a different key)"

          # Kotlin DSL: "compileSdk = <anything>"  ->  "compileSdk = 36"
          sed -i -E 's/^([[:space:]]*)compileSdk([[:space:]]*=[[:space:]]*).*/\1compileSdk = 36/' "$FILE"
          # Groovy DSL: "compileSdkVersion <anything>" -> "compileSdkVersion 36"
          sed -i -E 's/^([[:space:]]*)compileSdkVersion[[:space:]]+.*/\1compileSdkVersion 36/' "$FILE"

          echo "--- after ---"
          grep -in "compileSdk" "$FILE"

      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
